name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, fileinfo, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          archive="ev-api-${RELEASE_TAG}.zip"
          zip -r "${RUNNER_TEMP}/${archive}" . \
            -x '.env' \
            -x 'bootstrap/cache/*.php' \
            -x 'storage/logs/*' \
            -x 'storage/framework/cache/data/*'
          echo "ARCHIVE_NAME=${archive}" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=${RUNNER_TEMP}/${archive}" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
