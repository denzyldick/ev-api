name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest

    # Same engine and credentials as compose.yaml; the runner reaches the
    # service on localhost rather than through Docker's service DNS.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: laravel
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, fileinfo, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Create environment file
        run: cp .env.example .env

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify MariaDB connection
        run: php artisan db:show

      - name: Mago (analyze, lint, format)
        run: composer quality

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Tests
        run: composer test
